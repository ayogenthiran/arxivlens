services:
  api:
    image: arxivlens-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arxivlens-api
    command: python main.py
    env_file:
      - .env
    environment:
      # Published ports reach the container only if the process listens beyond loopback.
      HOST: 0.0.0.0
      PORT: ${PORT:-8000}
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/readiness' % os.environ.get('PORT', '8000'))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  ui:
    image: arxivlens-app:latest
    container_name: arxivlens-ui
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=${UI_PORT:-8501}
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:${PORT:-8000}
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8501}:${UI_PORT:-8501}"
    restart: unless-stopped

  ingest:
    image: arxivlens-app:latest
    container_name: arxivlens-ingest
    command: python main.py --process-data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    profiles:
      - ingest
